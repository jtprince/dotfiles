######################################################
# use default shell
######################################################
# set-option -g default-shell /usr/bin/zsh

######################################################
# remap prefix to Ctrl+a (default is Ctrl+b)
######################################################
set -g prefix C-a
# bind 'C-a C-a' to type 'C-a'
bind C-a send-prefix
unbind C-b

######################################################
# navigate panes with vim movement keys
######################################################
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# and use C-h and C-l to cycle thru panes
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

######################################################
# mouse: select/resize panes, select windows, scroll
######################################################
set -g mouse on

######################################################
# terminal: truecolor under kitty, OSC 52 clipboard
######################################################
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
# Copies in tmux reach the local clipboard, including over ssh.
set -s set-clipboard on
# Short escape delay so Esc in nvim is not read as Meta.
set -s escape-time 10
set -g history-limit 50000

######################################################
# misc
######################################################
bind k confirm kill-window
bind K confirm kill-server

######################################################
# use vim + custom left-hand keys for copy/paste mode
######################################################
setw -g mode-keys vi

unbind p
bind p paste-buffer

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# left-hand movement: s/d/f/g = left/up/down/right
bind -T copy-mode-vi s send -X cursor-left
bind -T copy-mode-vi f send -X cursor-down
bind -T copy-mode-vi d send -X cursor-up
bind -T copy-mode-vi g send -X cursor-right

bind -T copy-mode-vi j command-prompt -1 -p "(jump forward)" { send -X jump-forward "%%" }
bind -T copy-mode-vi h send -X history-top
